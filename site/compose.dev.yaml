services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wheelsite
      POSTGRES_USER: wheelsite
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - dev_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wheelsite -d wheelsite']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dev_pgdata:
